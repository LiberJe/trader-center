[project]
name = "trader-center"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "akshare>=1.15",
    "pyarrow>=15.0",
    "backtrader>=1.9.78",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
]
backtest = [
    "quantstats>=0.0.62",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
include = ["trader_center*"]
exclude = ["logs*", "backtest_runner*", "tests*"]
