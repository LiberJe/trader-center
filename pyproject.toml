[project]
name = "trader-center"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "akshare>=1.15",
    "pyarrow>=15.0",
    "backtrader>=1.9.78",
    "alphalens-reloaded>=0.4.3",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
]
backtest = [
    "quantstats>=0.0.62",
    "matplotlib>=3.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader_center*", "backtest_runner*"]
exclude = ["logs*", "backtest_results*", "tests*", "examples*"]
